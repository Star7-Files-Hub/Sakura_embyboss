# ============================================================
# 本文件是 nginx 的 http{} 上下文片段（include 片段），不是主配置。
#   - 用法：放进 /etc/nginx/conf.d/，或在 nginx.conf 的 http{} 内 include 它。
#   - 不要用 `nginx -c` 直接加载本文件（顶层就是 server{}，缺少 events{}）。
#   - 旧版本文件开头有一个 `.........;` 占位块，会让 `nginx -t` 直接失败，已删除（D-L4）。
# ============================================================

# ============================================================
# Sakura_embyboss Nginx 示例
# ============================================================
# 这个示例包含两项可选能力：
#
# 1. 线路上报
#    用户播放时，nginx 通过 mirror 把当前请求对应的“线路信息”异步上报给
#    bot 的 /emby/line_report，bot 再结合 emby_whitelist_line 判断该用户
#    是否有权限使用当前线路。
#
# 2. 播放列表拦截
#    用户尝试创建/修改/删除播放列表时，请求不会继续交给 Emby，而是由 nginx
#    内部转发到 bot 的 /emby/ban_playlist，由 bot 执行封禁与通知逻辑。
#
# ------------------------------------------------------------
# 如果你要在自己的环境启用，请重点修改下面这些地方：
#
# A. Emby 后端地址
#    - upstream emby_backend 里的 server 127.0.0.1:8096;
#    - 如果 Emby 不在本机，请改成实际地址，例如 192.168.1.10:8096。
#
# B. Bot API 地址
#    - upstream bot_api_backend 里的 server 127.0.0.1:8838;
#    - 如果 bot 不在本机，请改成实际地址。
#
# C. 当前线路的域名
#    - server_name localhost;
#    - 请改成用户实际访问这条线路时使用的域名，例如 media-vip.example.com。
#
# D. 当前线路的标识名
#    - set $line_name "localhost";
#    - 这是给 bot 用的“线路名”，建议每条线路都不一样，例如：
#      "line_a" / "line_b" / "vip" / "internal"
#
# E. 内部令牌（新增，必改）
#    - 两处 `proxy_set_header X-Internal-Token CHANGE_ME_INTERNAL_TOKEN;`
#    - 必须替换成与 config.json 中 `api.internal_token` **完全相同**的值。
#      bot 侧会用它校验“请求确实来自反代”，不一致时 bot 一律返回 403。
#
# F. Bot 配置文件
#    - 仅改 nginx 不够，你还需要在 bot 的 config.json 中配置 emby_whitelist_line。
#    - 这个值应能和当前线路上报到 bot 的 host / line 对上。
#    - 例如本 server 块的 server_name 是 media-vip.example.com，
#      那么 emby_whitelist_line 建议配置为 media-vip.example.com。
#
# G. 如果你有多条线路
#    - 通常做法是复制整段 server { ... }，每条线路一份；
#    - 然后分别修改：
#      1) listen / ssl
#      2) server_name
#      3) set $line_name
#      4) 日志、证书等
#    - bot 会根据每个 server 块上报的 line / host 区分线路。
#
# ------------------------------------------------------------
# 如果你只想启用“线路上报”，至少保留：
# - /emby/Sessions/Playing 里的 mirror 配置
# - location = /internal_line_report
#
# 如果你只想启用“播放列表拦截”，至少保留：
# - location @ban_playlist_block
# - 所有 /emby/Playlists... 相关 location
#
# 如果两项都不想启用，就删掉对应 location，只保留普通反代 location / 即可。
upstream emby_backend {
    # Emby 服务地址
    server 127.0.0.1:8096;
}

upstream bot_api_backend {
    # Sakura_embyboss Web API 地址
    # 注意：config.json 中 api.http_url 必须配成 127.0.0.1（只监听回环），
    #       不要配 0.0.0.0，否则 8838 会绕过反代直接对公网暴露（D-C2）。
    server 127.0.0.1:8838;
}

# ============================================================
# D-M4：TLS 提示（正式环境必读）
# ------------------------------------------------------------
# 下面示例监听的是明文端口（8080），只适合本机调试。
# Emby 客户端会在请求头/查询串里携带 Emby 凭据（X-Emby-Token /
# X-Emby-Authorization / api_key），明文 HTTP 会让同链路的任何人抓到这些凭据，
# 进而直接接管 Emby 账号（含管理员）。
#
# 正式环境请把 server 块的 listen 改成 HTTPS，例如：
#
#     listen 443 ssl;
#     listen [::]:443 ssl;
#     http2 on;                       # nginx >= 1.25.1；更早版本写 listen 443 ssl http2;
#     ssl_certificate     /etc/nginx/certs/fullchain.pem;
#     ssl_certificate_key /etc/nginx/certs/privkey.pem;
#     ssl_protocols       TLSv1.2 TLSv1.3;
#     ssl_ciphers         HIGH:!aNULL:!MD5;
#     ssl_session_cache   shared:SSL:10m;
#     ssl_session_timeout 1h;
#     add_header Strict-Transport-Security "max-age=31536000" always;
#
# 并增加一个只做跳转的 80 端口 server 块：
#
#     server {
#         listen 80;
#         listen [::]:80;
#         server_name media-vip.example.com;
#         return 301 https://$host$request_uri;
#     }
#
# （用 Caddy 反代时默认会自动申请证书，无需手工配置。）
# ============================================================
server {
    # 示例中使用 8080（明文，仅供调试）。
    # 正式环境改成 443 ssl 并配置证书，见上面的 TLS 提示。
    listen 8080;

    # 当前这条线路对应的访问域名。
    # bot 在线路上报时会收到 host=$server_name。
    server_name localhost;

    # 当前 server 块对应的“线路名称”。
    # 如果你复制多个 server 块做多线路，请确保每条线路的值不同。
    set $line_name "localhost";

    # 可按需修改日志路径。
    # 注意：access 日志会记录完整请求行，若把 token 放在查询串（?token=xxx）会明文落盘，
    #       请确保日志目录权限收敛并纳入轮转。
    access_log /var/log/nginx/emby_local_access.log;
    error_log  /var/log/nginx/emby_local_error.log info;

    # ==================== 通用反代 ====================
    # 除了下面单独处理的接口外，其余 Emby 请求都正常转发给 Emby。
    location / {
        proxy_pass http://emby_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ==================== 线路上报 ====================
    # 这里只拦截播放相关请求。
    #
    # 工作方式：
    # 1) 原始播放请求照常转发给 Emby；
    # 2) nginx 额外发一个 mirror 子请求到 /internal_line_report；
    # 3) /internal_line_report 再把 line / host / 请求头转发到 bot 的 /emby/line_report。
    #
    # 如果你不想启用“线路上报”，可以去掉下面两行：
    #   mirror /internal_line_report;
    #   mirror_request_body off;
    location ~* ^/emby/Sessions/Playing {
        mirror /internal_line_report;
        mirror_request_body off;

        proxy_pass http://emby_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # mirror 专用 internal location。
    # 用户不会直接访问到这里，只会被 nginx 内部子请求调用。
    #
    # 注意：internal 只保护“nginx 自己的子请求入口”，它**不能**让 bot 的 API 端口
    #       变得不可达，真正决定 API 是否对外的是 config.json 的 api.http_url。
    location = /internal_line_report {
        internal;

        # bot 的 /emby/line_report 使用 GET，不需要请求体。
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        # 把原始请求 URI 带给 bot。
        # bot 会从 URI 中解析 userId、deviceId、SessionId、token 等线索。
        proxy_set_header X-Original-URI $request_uri;

        # 把 Emby 常见认证头一并转发给 bot，便于 bot 识别当前用户。
        proxy_set_header X-Emby-Authorization $http_x_emby_authorization;
        proxy_set_header X-Emby-Token $http_x_emby_token;

        # ---- D-C1 / 接口契约 3.3：内部端点鉴权 ----
        # /emby/line_report 与 /emby/ban_playlist 是“反代 → bot”的内部端点，
        # 不再复用会泄露给前端的 bot_token，改用独立的内部令牌。
        # ⚠️ 下面的 CHANGE_ME_INTERNAL_TOKEN 必须替换成与 config.json 中
        #    `api.internal_token` 完全一致的值；两边不一致时 bot 会返回 403，
        #    线路上报与播放列表拦截会整体失效。
        proxy_set_header X-Internal-Token CHANGE_ME_INTERNAL_TOKEN;

        # 真正的线路上报接口。
        # 这里会向 bot 上报：
        # - line=$line_name   当前线路名称
        # - host=$server_name 当前线路域名
        #
        # 如果你的 bot_api_backend 地址变了，只需要改 upstream，不需要改这里。
        proxy_pass http://bot_api_backend/emby/line_report?line=$line_name&host=$server_name;
    }

    # ==================== 播放列表拦截 ====================
    # 这是播放列表拦截的内部跳转终点。
    #
    # 工作方式：
    # 1) Playlists 相关 location 命中敏感方法时先 return 418；
    # 2) error_page 418 = @ban_playlist_block;
    # 3) nginx 内部跳转到这里；
    # 4) 再转发给 bot 的 /emby/ban_playlist。
    #
    # 这样做的好处是：
    # - 客户端不会被 301 重定向到一个可能不可访问的地址；
    # - 封禁逻辑只在服务器内部发生。
    location @ban_playlist_block {
        internal;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;

        # ---- D-C1 / 接口契约 3.3：内部端点鉴权 ----
        # 与 /internal_line_report 里的值必须相同，且与 config.json 的
        # api.internal_token 完全一致。
        proxy_set_header X-Internal-Token CHANGE_ME_INTERNAL_TOKEN;

        # ⚠️ 关于 eid 的归属（bot 侧已闭环，但请勿删除下面的认证头转发）
        # 下面的 eid 来自**客户端可控**的 `?userId=` 查询参数，而 /emby/ban_playlist
        # 的副作用是「禁用任意 Emby 账号 + 数据库标记封禁 + 通知 TG 群」。
        # 内部令牌只能挡住“绕过 nginx 直连 bot 端口(8838)”的攻击者，挡不住
        # “直接请求本线路域名”的攻击者——他们可以构造
        #   POST /emby/Playlists?userId=<受害者ID>
        # 让 nginx 带着合法内部令牌替他去封禁任意用户（含管理员）。
        #
        # 因此 bot 侧（bot/web/api/ban_playlist.py）现在会：
        #   1) 取出下面转发的调用方 Emby 令牌；
        #   2) 用该令牌向 Emby 请求 /Users/Me，确认令牌归属；
        #   3) 只有归属与 eid 一致时才执行封禁，否则拒绝并记录日志。
        # **所以下面两行认证头转发是封禁功能能否工作的前提，不能删除**；
        # 缺失时 bot 会以“无法证实 eid 归属”为由拒绝执行封禁（有意的安全默认值）。
        proxy_set_header X-Emby-Token $http_x_emby_token;
        proxy_set_header X-Emby-Authorization $http_x_emby_authorization;
        proxy_pass http://bot_api_backend/emby/ban_playlist?eid=$arg_userId;
    }

    # ==================== 播放列表拦截 ====================
    # 如果你不想启用“播放列表拦截”，可以删掉下面所有 /emby/Playlists... 相关 location。

    # 创建新的播放列表
    location ~* ^/emby/Playlists$ {
        # 命中 return 418 后，内部跳转到 @ban_playlist_block
        error_page 418 = @ban_playlist_block;

        if ($request_method = POST) {
            return 418;
        }

        proxy_pass http://emby_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 添加条目到播放列表，同时把 GET 查看结果伪装成空列表。
    # 如果你只想拦截“添加”，不想屏蔽“查看”，可以删掉 GET 分支。
    location ~ ^/emby/Playlists/(\w+)/Items$ {
        default_type application/json;
        error_page 418 = @ban_playlist_block;

        if ($request_method = POST) {
            return 418;
        }

        if ($request_method = GET) {
            return 200 '{"Items":[],"TotalRecordCount":0}';
        }

        proxy_pass http://emby_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 删除播放列表条目
    location ~ ^/emby/Playlists/(\w+)/Items/(\w+)$ {
        error_page 418 = @ban_playlist_block;

        if ($request_method = DELETE) {
            return 418;
        }

        proxy_pass http://emby_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 移动播放列表条目
    location ~ ^/emby/Playlists/(\w+)/Items/(\w+)/Move/(\w+)$ {
        error_page 418 = @ban_playlist_block;

        if ($request_method = POST) {
            return 418;
        }

        proxy_pass http://emby_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

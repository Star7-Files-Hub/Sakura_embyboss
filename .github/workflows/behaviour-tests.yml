name: Behaviour tests

# 这些测试用 AST 从真实源文件里抽出函数来执行（只桩外部依赖），
# 不需要安装 pyrogram / SQLAlchemy，纯标准库即可跑。
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  behaviour-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # test_removal.py 里有一项要真正加载 pydantic 的 Config 模型。
      # 不装的话它会静默 SKIP，等于没测 —— 之前「本地全绿」就是这么来的假象。
      - name: 安装测试依赖
        run: pip install "pydantic==2.1.1"

      - name: 单用户警告调整 / 面板刷新
        run: python tests/test_kk_warn_panel.py

      - name: 终止流复验
        run: python tests/test_terminate_verify.py

      - name: 播放速率限制移除
        run: python tests/test_removal.py

      - name: 备份同时发送 .sql 与 config.json 给 owner
        run: python tests/test_backup_sends_config.py

      - name: 备份收件人硬绑定 owner 私聊（拒绝群组）
        run: python tests/test_backup_recipient.py

      - name: /kk 警告+1 按钮
        run: python tests/test_warn_plus_button.py

      - name: 警告计数丢失更新竞态（检测任务 vs 管理员调整）
        run: python tests/test_warn_count_race.py

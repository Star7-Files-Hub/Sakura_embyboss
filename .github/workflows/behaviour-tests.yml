name: Behaviour tests

# 这些测试用 AST 从真实源文件里抽出函数来执行（只桩外部依赖），
# 不需要安装 pyrogram / SQLAlchemy，纯标准库即可跑。
# 例外：test_emby_limiter 测的是真实模块（闸门/熔断/队列/建号快路径），
# 必须真正 import bot，所以它单独装 requirements.txt，且**只在 3.10 上跑**
# —— 见下方 matrix.exclude 的说明。
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  behaviour-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        suite:
          - test_kk_warn_panel
          - test_warn_plus_button
          - test_warn_count_race
          - test_terminate_verify
          - test_temp_kick
          - test_emby_policy
          - test_kick_verify_userid
          - test_removal
          - test_backup_sends_config
          - test_backup_recipient
          - test_emby_limiter
        # test_emby_limiter 要装完整 requirements.txt，而其中两个包在 3.12 上
        # **没有 wheel**，只能源码编译：
        #   uvloop~=0.17.0 —— 只发到 cp311，3.12 编译直接失败（实测 CI 红在这里）
        #   TgCrypto~=1.2.5 —— 只发到 cp311，是 Pyrogram 的硬依赖，3.12 得现编
        # 生产镜像用的是 python:3.10.11，所以这个集成套件只在 3.10 上跑；
        # 其它 10 个套件（纯 stdlib + pydantic）仍然 3.10 / 3.12 双版本。
        # 刻意用 exclude 而不是 if 跳过：不留「跑了个寂寞但显示绿」的空 job。
        exclude:
          - python-version: "3.12"
            suite: test_emby_limiter
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # test_removal.py 里有一项要真正加载 pydantic 的 Config 模型。
      # 不装的话它会静默 SKIP，等于没测 —— 之前「本地全绿」就是这么来的假象。
      - name: 安装测试依赖
        run: pip install "pydantic==2.1.1"

      # 其它 10 套走「AST 抽取 + 桩模块」，只要 stdlib + pydantic。
      # 但 test_emby_limiter.py 测的是**真实**的 register_throttle / register_queue /
      # 建号快路径，必须真正 `import bot` —— 于是需要运行期依赖 + 一份 config.json
      # （config.json 被 .gitignore 排除，CI 里要用模板现造一份）。
      # 刻意**不**给它静默 SKIP 的后门：跑不了就让 CI 红，别再造一次「徽章全绿但没测」。
      # 3.10 上 requirements.txt 全部有 wheel（TgCrypto / uvloop 都发到 cp310），
      # 所以这里直接装即可；3.12 上这两个包没有 wheel，已在 matrix.exclude 里排除。
      - name: 为 test_emby_limiter 准备运行期依赖与 config.json
        if: matrix.suite == 'test_emby_limiter'
        run: |
          set -euo pipefail
          cp config_example.json config.json
          pip install -r requirements.txt

      - name: 跑 ${{ matrix.suite }}
        env:
          # 没有数据库，别让 alembic 自动迁移卡住导入
          SAKURA_SKIP_AUTO_MIGRATE: "1"
        run: python tests/${{ matrix.suite }}.py

  # 这个 job 专门防「新加的套件忘了写进 CI」。
  # 本项目已经发生过一次：套件从 7 个涨到 10 个，CI 清单还停在 7 个，
  # 于是新套件在 CI 里**从来没跑过**，而所有徽章都是绿的。
  # 只比对清单与磁盘，不跑测试，所以很快。
  suite-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: CI 清单必须覆盖 tests/ 下全部 test_*.py
        run: |
          python - <<'PY'
          import pathlib, re, sys

          wf = pathlib.Path(".github/workflows/behaviour-tests.yml").read_text(encoding="utf-8")
          # matrix 的 suite 列表：缩进后以 "- test_" 开头的行
          declared = set(re.findall(r"^\s+-\s+(test_[A-Za-z0-9_]+)\s*$", wf, re.M))
          on_disk = {p.stem for p in pathlib.Path("tests").glob("test_*.py")}

          missing = sorted(on_disk - declared)
          stale = sorted(declared - on_disk)
          for s in missing:
              print(f"::error::tests/{s}.py 存在于仓库但没写进 CI 清单，永远不会被跑")
          for s in stale:
              print(f"::error::CI 清单里的 {s} 在 tests/ 下不存在")
          print(f"CI 清单 {len(declared)} 套，磁盘 {len(on_disk)} 套")
          if missing or stale:
              sys.exit(1)
          print("✅ CI 清单与 tests/ 完全一致")
          PY
